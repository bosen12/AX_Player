    <circle cx="60" cy="18" r="3.2"/>
    <circle cx="89.7" cy="30.3" r="3.2"/>
    <circle cx="102" cy="60" r="3.2"/>
    <circle cx="89.7" cy="89.7" r="3.2"/>
    <circle cx="60" cy="102" r="3.2"/>
    <circle cx="30.3" cy="89.7" r="3.2"/>
    <circle cx="18" cy="60" r="3.2"/>
    <circle cx="30.3" cy="30.3" r="3.2"/>
