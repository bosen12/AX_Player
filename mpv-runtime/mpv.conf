# Minimal config for AX Player's bundled mpv runtime.
#
# This is deliberately small: sensible defaults only, no hand-tuned
# scaler/deband/HDR chain. Anime4K ships alongside (see shaders/ and the
# Ctrl+1..3 bindings in input.conf) but stays off until a key is pressed.
# VapourSynth and RIFE are not set up here -- Fluid Motion installs those
# into whichever config dir the running player reports.

# ====== Video ======
# auto-safe, not auto-copy: copy-back costs a GPU->CPU transfer on every
# frame and normal playback does not need it. VapourSynth does (it cannot
# read a GPU-resident frame), so Fluid Motion switches this to auto-copy
# over IPC while interpolation is on and restores it afterwards.
hwdec=auto-safe
vo=gpu-next

# ====== uosc UI ======
# uosc (in scripts/uosc) draws its own on-video controls; mpv's built-in
# OSC and window border must stay off so they don't fight with it.
osc=no
osd-bar=no
border=no

# ====== Behavior ======
keep-open=yes
save-position-on-quit=yes

# ====== Subtitles ======
sub-auto=fuzzy
