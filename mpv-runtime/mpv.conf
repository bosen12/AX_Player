# Minimal config for AX Player's bundled mpv runtime.
#
# This is deliberately small: no Anime4K/VapourSynth/RIFE shader chains,
# no SVP interpolation. Those belong to power-user setups (see the
# project's own C:\mpv for an example of one) -- this bundle only needs
# to play video well and let uosc/thumbfast draw the on-screen UI.

# ====== Video ======
hwdec=auto-safe
vo=gpu-next

# ====== uosc UI ======
# uosc (in scripts/uosc) draws its own on-video controls; mpv's built-in
# OSC and window border must stay off so they don't fight with it.
osc=no
osd-bar=no
border=no

# ====== Behavior ======
keep-open=yes
save-position-on-quit=yes

# ====== Subtitles ======
sub-auto=fuzzy
