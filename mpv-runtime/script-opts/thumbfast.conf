# mpv_path is set at runtime by player_widget.py (thumbfast-mpv_path=...
# via script-opts), pointed at whichever mpv.exe default_mpv_root()
# resolved to -- this file's own value is only used for a standalone
# mpv.exe launched directly against this runtime's config_dir.
mpv_path=mpv.exe

# Start the thumbnailer when a file loads rather than on the first hover.
#
# thumbfast only shows "ERROR! cannot create mpv subprocess" while no spawn
# has ever worked -- it guards that message on its own spawn_working flag, and
# the first success clears it for the rest of the session. The failure being
# reported is the process refusing to start (mpv logs "Subprocess failed:
# init"), which on Windows tends to hit the first launch of mpv.exe and not
# later ones, so the very first attempt is the one most likely to fail.
#
# Making that first attempt at load instead of at hover gets a success on the
# board before the seek bar is ever touched, and hover previews are ready the
# moment they are wanted. The cost is one thumbnailer process per loaded file,
# which thumbfast keeps alive after the first hover anyway.
spawn_first=yes
