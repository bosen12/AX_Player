# mpv_path is set at runtime by player_widget.py (thumbfast-mpv_path=...
# via script-opts), pointed at whichever mpv.exe default_mpv_root()
# resolved to -- this file's own value is only used for a standalone
# mpv.exe launched directly against this runtime's config_dir.
mpv_path=mpv.exe

# spawn_first is deliberately left off. Turning it on moves the thumbnailer's
# first spawn from the first hover to file load -- which, when AX Player is
# started by opening a video from the shell, lands in the middle of a cold
# start: PyInstaller unpacking, Qt starting, libmpv initialising and the GPU
# context being built, all at once. That is the moment the spawn is most
# likely to be refused, and refusals are what the error message reports.
# Waiting for a hover puts the attempt somewhere calmer. The transient
# failure itself is handled by the retry in scripts/thumbfast.lua.
