# Minimal overrides for this bundle -- everything else uses uosc's own
# defaults. See https://github.com/tomasklaen/uosc for the full option list.

# AX Player supplies its own titlebar with real window controls, so uosc's
# redundant on-video min/max/close row is turned off (also enforced at
# runtime by player_widget.py's script_opts, independent of this file).
top_bar=never

# This bundle doesn't ship uosc's optional bin/ sort helper (a few MB of
# native binaries for natural-language filename sorting), so leave the
# default (non-natural) sort in place.
refine=
