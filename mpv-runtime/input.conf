# AX Player's bundled mpv runtime ships no custom shader chains, so there
# are no Anime4K-style shortcuts here -- mpv's own defaults (space to
# pause, arrows to seek, f for fullscreen, etc.) already apply via
# input_default_bindings in player_widget.py. Add your own bindings here
# if you want them; this file is loaded from this runtime's own
# directory, not from an existing personal mpv config.

F1 script-binding console/enable
