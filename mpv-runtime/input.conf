# mpv's own defaults (space to pause, arrows to seek, f for fullscreen,
# etc.) already apply via input_default_bindings in player_widget.py.
# This file is loaded from this runtime's own directory, not from an
# existing personal mpv config, so add your own bindings here freely.

F1 script-binding console/enable

# -- Anime4K -----------------------------------------------------------
# Off by default: these are anime upscalers and they make live action look
# worse, so nothing is applied until a key is pressed.
#
# Only upstream's three documented presets are bound. Longer hand-tuned
# chains exist and look better on a big GPU, but they are not a safe
# default to ship -- and note they compete for the same GPU as Fluid
# Motion's RIFE interpolation. Running a heavy chain and interpolation
# together will drop frames on most cards; the diagnostics panel reports
# when both are active, since the symptom (stutter) otherwise gives no
# hint which of the two to turn down.

# Mode A -- restore then upscale. The general-purpose choice for 1080p.
CTRL+1 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A" 2000

# Mode B -- softer restore, for thin lines and gentler art styles.
CTRL+2 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_Soft_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode B" 2000

# Mode C -- denoise while upscaling, for older or heavily compressed sources.
CTRL+3 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode C" 2000

CTRL+0 no-osd change-list glsl-shaders clr ""; show-text "Anime4K: off" 2000
